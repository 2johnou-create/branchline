name: Container validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'engine.Dockerfile'
      - 'server.Dockerfile'
      - 'deploy/**'
      - 'engine/mirofish/backend/**'
      - 'server/requirements.txt'
      - '.github/workflows/containers.yml'
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned CPU engine
        run: docker build -f engine.Dockerfile -t branchline-engine:check .
      - name: Check real simulation imports
        run: |
          docker run --rm --network none branchline-engine:check python -c "import oasis, camel, torch, cairocffi; from app import create_app; assert torch.version.cuda is None; print('CPU simulation runtime imports passed')"
      - name: Check engine API and hardening without provider calls
        run: |
          docker run --rm --network none -e LLM_API_KEY=nonfunctional-ci-placeholder -e ZEP_API_KEY=nonfunctional-ci-placeholder -e BRANCHLINE_ENGINE_CLEANUP_SECRET=nonfunctional-ci-cleanup-key-32-characters branchline-engine:check python -c "import engine_entry; c=engine_entry.application.test_client(); r=c.get('/health',headers={'Origin':'https://untrusted.example'}); assert r.status_code==200; assert not any(k.lower().startswith('access-control-') for k in r.headers.keys()); assert not engine_entry.application.debug; path='/internal/branchline/simulations/sim_abcdef123456'; assert c.delete(path).status_code==403; r=c.delete(path,headers={'X-Branchline-Cleanup-Key':'nonfunctional-ci-cleanup-key-32-characters'}); assert r.status_code==200 and r.json['data']['deleted'] is True; print('Private engine health and hardening passed')"
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server.Dockerfile -t branchline-gateway:check .
      - name: Verify gateway imports without secrets or network
        run: docker run --rm --network none branchline-gateway:check python -c "from server.app import create_app; from cryptography.fernet import Fernet; from server.config import Settings; from fastapi.testclient import TestClient; app=create_app(Settings(database='/tmp/check.sqlite3',encryption_key=Fernet.generate_key().decode()),launch_jobs=False); c=TestClient(app); assert c.get('/health').status_code==200; assert c.get('/api/v1/runs').status_code==401; print('Gateway container smoke passed')"
